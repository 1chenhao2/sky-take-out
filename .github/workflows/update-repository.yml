name: Update repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          git fetch ./sky-take-out.bundle refs/heads/publish-main
          git push --force origin FETCH_HEAD:main
